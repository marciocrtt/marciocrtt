<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-label="Marcio Cerutti em n&#250;meros">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 15px; font-weight: 600; fill: #e6edf3; letter-spacing: .5px; }
      .sub { font-size: 12px; fill: #7d8590; }
      .num { font-size: 30px; font-weight: 700; fill: url(#accent); }
      .lbl { font-size: 12.5px; fill: #9da7b3; }
      .foot { font-size: 12.5px; fill: #9da7b3; }
      .foot b { fill: #22d3ee; }
      .tile { fill: #111827; stroke: #1f2a3a; }
      .t { opacity: 0; animation: up .6s ease-out forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="840" height="340" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="839" height="339" rx="14" fill="none" stroke="#1f2a3a"/>

  <text x="28" y="40" class="title">&gt; em n&#250;meros</text>
  <text x="812" y="40" class="sub" text-anchor="end">todos os projetos, inclusive os privados &#183; out/2026</text>

  <g class="t" style="animation-delay:.05s">
    <rect x="28" y="62" width="186" height="96" rx="10" class="tile"/>
    <text x="46" y="110" class="num">2.439</text>
    <text x="46" y="138" class="lbl">contribui&#231;&#245;es</text>
  </g>
  <g class="t" style="animation-delay:.15s">
    <rect x="226" y="62" width="186" height="96" rx="10" class="tile"/>
    <text x="244" y="110" class="num">3.087</text>
    <text x="244" y="138" class="lbl">commits</text>
  </g>
  <g class="t" style="animation-delay:.25s">
    <rect x="424" y="62" width="186" height="96" rx="10" class="tile"/>
    <text x="442" y="110" class="num">62</text>
    <text x="442" y="138" class="lbl">pull requests &#183; 41 aceitos</text>
  </g>
  <g class="t" style="animation-delay:.35s">
    <rect x="622" y="62" width="190" height="96" rx="10" class="tile"/>
    <text x="640" y="110" class="num">157</text>
    <text x="640" y="138" class="lbl">merges</text>
  </g>

  <g class="t" style="animation-delay:.45s">
    <rect x="28" y="170" width="186" height="96" rx="10" class="tile"/>
    <text x="46" y="218" class="num">+1,5 mi</text>
    <text x="46" y="246" class="lbl">linhas de c&#243;digo adicionadas</text>
  </g>
  <g class="t" style="animation-delay:.55s">
    <rect x="226" y="170" width="186" height="96" rx="10" class="tile"/>
    <text x="244" y="218" class="num">&#8722;881 mil</text>
    <text x="244" y="246" class="lbl">linhas removidas</text>
  </g>
  <g class="t" style="animation-delay:.65s">
    <rect x="424" y="170" width="186" height="96" rx="10" class="tile"/>
    <text x="442" y="218" class="num">28,9 mil</text>
    <text x="442" y="246" class="lbl">arquivos alterados</text>
  </g>
  <g class="t" style="animation-delay:.75s">
    <rect x="622" y="170" width="190" height="96" rx="10" class="tile"/>
    <text x="640" y="218" class="num">21</text>
    <text x="640" y="246" class="lbl">projetos</text>
  </g>

  <g class="t" style="animation-delay:.9s">
    <text x="28" y="304" class="foot"><tspan fill="#22d3ee" font-weight="600">199</tspan> dias com commit   &#183;   maior sequ&#234;ncia <tspan fill="#22d3ee" font-weight="600">14 dias</tspan>   &#183;   recorde <tspan fill="#22d3ee" font-weight="600">99 contribui&#231;&#245;es</tspan> em um dia</text>
  </g>
</svg>
